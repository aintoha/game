<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2-Week Coffee Market</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bar-transition { transition: height 0.3s ease, background-color 0.3s ease; }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans min-h-screen p-8 flex items-center justify-center">
    <div class="max-w-3xl w-full">
        <header class="mb-6 text-center">
            <h1 class="text-3xl font-bold text-green-400 mb-2">2-Week Simple Coffee Market</h1>
            <p class="text-gray-400">A simplified 4-path model (Drought = +$10, Rain = -$10)</p>
        </header>

        <!-- Main Dashboard -->
        <div class="bg-gray-800 p-6 rounded-xl shadow-lg border border-gray-700 mb-6">
            <div class="text-center mb-6">
                <p class="text-gray-400 text-sm uppercase tracking-wider mb-1">Current Coffee Price</p>
                <div id="priceDisplay" class="text-6xl font-bold text-white">$100</div>
                <div id="weekDisplay" class="text-yellow-400 font-semibold mt-2">Week 0 of 2</div>
            </div>

            <div class="flex justify-center space-x-4">
                <button id="actionBtn" onclick="takeStep()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-6 rounded-lg text-lg transition duration-200 shadow-lg">
                    🌦️ Generate Weather
                </button>
                <button onclick="resetSim()" class="bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 px-6 rounded-lg text-lg transition duration-200">
                    🔄 Reset
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- PMF Visualizer (Simple CSS Bars) -->
            <div class="bg-gray-800 p-6 rounded-xl shadow-lg border border-gray-700">
                <h2 class="text-lg font-bold text-blue-400 mb-4 border-b border-gray-700 pb-2">Menu of Risk (PMF)</h2>
                <div class="flex items-end justify-around h-40 border-b border-gray-600 pb-2 relative">
                    
                    <!-- $80 Bar -->
                    <div class="flex flex-col items-center w-1/3">
                        <span id="prob80-text" class="text-xs text-gray-400 mb-1">25%</span>
                        <div id="prob80-bar" class="w-12 bg-red-500 rounded-t bar-transition" style="height: 25%;"></div>
                        <span class="mt-2 text-sm font-bold text-gray-300">$80</span>
                    </div>

                    <!-- $100 Bar -->
                    <div class="flex flex-col items-center w-1/3">
                        <span id="prob100-text" class="text-xs text-gray-400 mb-1">50%</span>
                        <div id="prob100-bar" class="w-12 bg-gray-500 rounded-t bar-transition" style="height: 50%;"></div>
                        <span class="mt-2 text-sm font-bold text-gray-300">$100</span>
                    </div>

                    <!-- $120 Bar -->
                    <div class="flex flex-col items-center w-1/3">
                        <span id="prob120-text" class="text-xs text-gray-400 mb-1">25%</span>
                        <div id="prob120-bar" class="w-12 bg-green-500 rounded-t bar-transition" style="height: 25%;"></div>
                        <span class="mt-2 text-sm font-bold text-gray-300">$120</span>
                    </div>
                </div>
            </div>

            <!-- Inequalities -->
            <div class="bg-gray-800 p-6 rounded-xl shadow-lg border border-gray-700 flex flex-col justify-center">
                <h2 class="text-lg font-bold text-orange-400 mb-4 border-b border-gray-700 pb-2">Farmer Survival</h2>
                <p class="text-gray-400 text-sm mb-2">Probability final price is <strong>at least $100</strong>.</p>
                <div id="survivalRate" class="text-5xl font-bold text-white">75%</div>
                <p id="survivalLogic" class="text-xs text-gray-500 mt-2">Sums the 50% ($100) and 25% ($120) paths.</p>
            </div>
        </div>
    </div>

    <script>
        const startPrice = 100;
        let currentPrice = startPrice;
        let weeks = 0;
        const maxWeeks = 2;

        function updateUI(p80, p100, p120) {
            // Update Text
            document.getElementById('prob80-text').innerText = p80 + '%';
            document.getElementById('prob100-text').innerText = p100 + '%';
            document.getElementById('prob120-text').innerText = p120 + '%';

            // Update Bars (Height visually scales to max 100%)
            document.getElementById('prob80-bar').style.height = p80 + '%';
            document.getElementById('prob100-bar').style.height = p100 + '%';
            document.getElementById('prob120-bar').style.height = p120 + '%';

            // Update Farmer Survival (>= 100)
            const survival = p100 + p120;
            document.getElementById('survivalRate').innerText = survival + '%';
            
            // Dim colors if 0%
            document.getElementById('prob80-bar').className = `w-12 rounded-t bar-transition ${p80 === 0 ? 'bg-gray-700' : 'bg-red-500'}`;
            document.getElementById('prob100-bar').className = `w-12 rounded-t bar-transition ${p100 === 0 ? 'bg-gray-700' : 'bg-gray-500'}`;
            document.getElementById('prob120-bar').className = `w-12 rounded-t bar-transition ${p120 === 0 ? 'bg-gray-700' : 'bg-green-500'}`;
        }

        function takeStep() {
            if (weeks >= maxWeeks) return;

            // 50/50 Weather Flip
            const isDrought = Math.random() >= 0.5;
            currentPrice += isDrought ? 10 : -10;
            weeks++;

            document.getElementById('priceDisplay').innerText = '$' + currentPrice;
            document.getElementById('priceDisplay').className = `text-6xl font-bold ${isDrought ? 'text-green-400' : 'text-red-400'}`;

            if (weeks === 1) {
                document.getElementById('weekDisplay').innerText = 'Week 1 of 2: ' + (isDrought ? 'Drought (+10)' : 'Rain (-10)');
                if (currentPrice === 110) {
                    updateUI(0, 50, 50); // From 110, can only hit 100 or 120
                    document.getElementById('survivalLogic').innerText = "Universe shrank! 0% chance to hit $80 now.";
                } else {
                    updateUI(50, 50, 0); // From 90, can only hit 80 or 100
                    document.getElementById('survivalLogic').innerText = "Universe shrank! 0% chance to hit $120 now.";
                }
            } else if (weeks === 2) {
                document.getElementById('weekDisplay').innerText = 'Week 2: Final Price Locked!';
                document.getElementById('actionBtn').disabled = true;
                document.getElementById('actionBtn').classList.add('opacity-50', 'cursor-not-allowed');
                
                if (currentPrice === 80) updateUI(100, 0, 0);
                else if (currentPrice === 100) updateUI(0, 100, 0);
                else if (currentPrice === 120) updateUI(0, 0, 100);
                
                document.getElementById('survivalLogic').innerText = "Season is over. Final outcome is 100% certain.";
            }
        }

        function resetSim() {
            currentPrice = startPrice;
            weeks = 0;
            
            document.getElementById('priceDisplay').innerText = '$100';
            document.getElementById('priceDisplay').className = 'text-6xl font-bold text-white';
            document.getElementById('weekDisplay').innerText = 'Week 0 of 2';
            
            document.getElementById('actionBtn').disabled = false;
            document.getElementById('actionBtn').classList.remove('opacity-50', 'cursor-not-allowed');
            
            updateUI(25, 50, 25);
            document.getElementById('survivalLogic').innerText = "Sums the 50% ($100) and 25% ($120) paths.";
        }
    </script>
</body>
</html>
